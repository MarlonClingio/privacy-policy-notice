<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Mercado Eletrônico</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page-login">
    <main class="card login-card">
      <h1 class="brand">Mercado <span>Eletrônico</span></h1>
      <p class="muted">Acesse sua conta para continuar.</p>

      <form id="login-form" novalidate>
        <label>
          E-mail
          <input name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="alert alert--error" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      </form>

      <section class="demo-accounts">
        <h2>Contas de demonstração <small>(senha: senha123)</small></h2>
        <div class="demo-accounts__list">
          <button type="button" class="btn btn--ghost" data-demo-email="ana@exemplo.com">Ana · cliente pendente</button>
          <button type="button" class="btn btn--ghost" data-demo-email="bruno@exemplo.com">Bruno · cliente pendente</button>
          <button type="button" class="btn btn--ghost" data-demo-email="carla@exemplo.com">Carla · já aceitou</button>
          <button type="button" class="btn btn--ghost" data-demo-email="admin@exemplo.com">Administrador</button>
        </div>
      </section>
    </main>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
