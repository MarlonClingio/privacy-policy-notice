<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha conta · Mercado Eletrônico</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Mercado <span>Eletrônico</span></span>
      <nav>
        <span>Olá, <strong id="user-name"></strong></span>
        <button id="logout" type="button" class="btn btn--ghost">Sair</button>
      </nav>
    </header>

    <main class="container">
      <h1>Minha conta</h1>
      <p id="privacy-status" hidden></p>

      <section class="grid-cards">
        <article class="card"><h2>Pedidos</h2><p class="muted">Acompanhe suas compras recentes.</p></article>
        <article class="card"><h2>Endereços</h2><p class="muted">Gerencie seus endereços de entrega.</p></article>
        <article class="card"><h2>Privacidade</h2><p class="muted">Seus dados são tratados conforme a LGPD.</p></article>
      </section>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
